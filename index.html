<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Server Logo</title>
    <style>
        html, body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            perspective-origin: 50% 50%;
        }

        .stage {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: spinAndVanish 2.6s ease-in-out forwards;
        }

        .stage img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            user-select: none;
            pointer-events: none;
        }

        /* Stacked layers: each copy is pushed slightly back in Z to fake thickness.
           Layer 0 is the front face (sharpest), higher layers are the "back". */
        .layer-0 { transform: translateZ(0px);   filter: brightness(1.00); }
        .layer-1 { transform: translateZ(-2px);  filter: brightness(0.92); }
        .layer-2 { transform: translateZ(-4px);  filter: brightness(0.84); }
        .layer-3 { transform: translateZ(-6px);  filter: brightness(0.76); }
        .layer-4 { transform: translateZ(-8px);  filter: brightness(0.68); }
        .layer-5 { transform: translateZ(-10px); filter: brightness(0.60); }
        .layer-6 { transform: translateZ(-12px); filter: brightness(0.52); }
        .layer-7 { transform: translateZ(-14px); filter: brightness(0.44); }

        @keyframes spinAndVanish {
            /* Spin two full turns while staying in place */
            0% {
                transform: rotateY(0deg) rotateX(0deg) translateY(0);
                opacity: 1;
            }
            75% {
                transform: rotateY(720deg) rotateX(0deg) translateY(0);
                opacity: 1;
            }
            /* Slight tilt + drop + fade out */
            100% {
                transform: rotateY(720deg) rotateX(35deg) translateY(400px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <img src="tevologo.png" class="layer-7" alt="">
        <img src="tevologo.png" class="layer-6" alt="">
        <img src="tevologo.png" class="layer-5" alt="">
        <img src="tevologo.png" class="layer-4" alt="">
        <img src="tevologo.png" class="layer-3" alt="">
        <img src="tevologo.png" class="layer-2" alt="">
        <img src="tevologo.png" class="layer-1" alt="">
        <img src="tevologo.png" class="layer-0" alt="">
    </div>
</body>
</html>
