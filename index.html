<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Server Logo</title>
    <style>
        body {
            background-color: transparent; /* Let team menu show through */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 800px;
        }

        .logo {
            width: 300px;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            /* 3D spin twice, then drop + fade out */
            animation: spinAndVanish 2.4s ease-in-out forwards;
        }

        @keyframes spinAndVanish {
            /* Phase 1: Spin twice (0% -> 80% of timeline) */
            0% {
                transform: rotateY(0deg) translateY(0);
                opacity: 1;
            }
            80% {
                transform: rotateY(720deg) translateY(0);
                opacity: 1;
            }
            /* Phase 2: Drop down + fade out (80% -> 100%) */
            100% {
                transform: rotateY(720deg) translateY(300px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <img src="tevologo.png" class="logo" alt="Logo">
</body>
</html>
